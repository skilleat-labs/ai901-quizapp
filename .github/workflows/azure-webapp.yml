name: Check and deploy AI-901 classroom
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quiz-webapp-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Package runtime only (answers remain server-side)
        run: zip -r app.zip package.json package-lock.json src public content
      - uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: app.zip
  deploy:
    # 저장소 변수 ENABLE_AZURE_DEPLOY=true 설정 전에는 배포하지 않습니다.
    if: vars.ENABLE_AZURE_DEPLOY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: webapp
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
